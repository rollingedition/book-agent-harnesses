# Chapter traces-and-cost's narration (re-check narration): descriptions of its examples, blocks and tables, as
# [examples.ID], [[blocks]] and [[tables]], and its own readings. Only this chapter's writer edits this file, so
# writers working in parallel never append to one shared lexicon. A reading every chapter needs goes into
# narration/lexicon.toml, which wins over a chapter's.

[examples.trace-one-run]
say = "The code replays the chapter 1 run on T-01 and writes one JSON line for each step. The output counts the records, {{out:trace-one-run:records}}, gives the first call's ID, sums the stored token counts, and shows the error Python gives for an empty line: {{out:trace-one-run:blank line}}. It writes the lines to a file and reads them back: {{out:trace-one-run:lines read back}} records, and {{out:trace-one-run:empty pieces skipped}} empty piece skipped on purpose."

[examples.token-counts-from-recording]
say = "The code adds up the stored token counts for each task in the task set, checks each sum against the recording's manifest, and prints the set's totals: {{out:token-counts-from-recording:set prompt tokens}} prompt tokens and {{out:token-counts-from-recording:set completion tokens}} completion tokens. The live count check is {{out:token-counts-from-recording:live count check}}."

[examples.cost-as-counts]
say = "The code groups the task set's stored counts by how each run ended, and prints each group's steps, tool calls and tokens, then the whole set. The line for the step-capped runs reads: {{out:cost-as-counts:ended step_cap}}. The last lines count the step-capped runs that are done, their share of the steps and prompt tokens, and how many have a prompt count that rises at every step."

[examples.figure-tokens-against-steps]
say = "The code draws each recorded run as one point: its steps along the bottom, its prompt tokens summed over the run up the side, and a marker for how the run ended. The step cap is {{out:figure-tokens-against-steps:step cap, in steps}} steps. The output gives the step-capped runs' share of the steps, {{out:figure-tokens-against-steps:step-capped share of steps}}, and of the prompt tokens, {{out:figure-tokens-against-steps:step-capped share of prompt tokens}}. It also gives the mean first-step prompt that sets the dashed line, and the prompt tokens per step of the step-capped runs and of the other runs."

[examples.child-trace-under-parent]
say = "A scripted parent starts a child on T-04. The child's records print under the call that started it, each with the parent's call ID. The gate refuses the child's finish, and the child stops with a question. The output gives the child's run, the call that started it, the held step, the sums of the parent's and the child's tokens, the child's budget, {{out:child-trace-under-parent:child budget}} steps, and the parent's stop, {{out:child-trace-under-parent:parent ended}}."

