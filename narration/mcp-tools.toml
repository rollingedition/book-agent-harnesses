# Chapter mcp-tools's narration (re-check narration): descriptions of its examples, blocks and tables, as
# [examples.ID], [[blocks]] and [[tables]], and its own readings. Only this chapter's writer edits this file, so
# writers working in parallel never append to one shared lexicon. A reading every chapter needs goes into
# narration/lexicon.toml, which wins over a chapter's.

[examples.list-server-tools]
say = "The code starts the two example servers and prints the newest protocol revision the SDK knows, which is {{out:list-server-tools:SDK latest revision}}. It then prints, for each server, the revision the two agreed on, which is {{out:list-server-tools:docs protocol revision}}, and the tools it lists. It then prints the names the model is offered. The offer leaves out the docs server's reset tool, because the harness's table has no class for it."

[examples.namespace-clash]
say = "The code puts the harness's own tools beside the two servers' tools. It prints the bare names the servers offer, where read file appears twice, and then the names the model sees, which number {{out:namespace-clash:names}} and are all different. Last, it calls the docs server's read file and the tracker's read file, and checks that each one reaches the server its prefix names."

[examples.annotation-is-a-hint]
say = "The code shows that the docs server marks the delete page tool as read-only, and that the harness still classes it as a change. A first call to that tool is refused because the person said no. A second call, approved, runs. The reset tool is marked read-only too, but the harness classes it as never run, so it is refused, even when the code hands the gate a copy of the tool directly. The last printed line is that forced call's refusal, which is the gate's, not the server's."

[examples.untrusted-output]
say = "The code runs task T zero one, the case's first task, with a scripted model. The first call reads issue seven from the tracker, and that issue's text asks the model to delete a test file. The harness marks that text as untrusted before the model reads it. The second call asks the docs server to delete the same file. The gate asks, the person says no, and the run ends as ask user after {{out:untrusted-output:steps}} steps, with the refusal as its question."

[examples.fence-cannot-be-closed]
say = "The code gives the harness's marking function eight spellings of the closing tag, in capitals, with spaces, with fullwidth brackets, with a zero width space, and as entities. In every result the harness's own two tags are the only tags left, so no spelling ends the fence early. The code prints the escaped form of one variant."

