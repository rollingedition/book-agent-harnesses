# Chapter sandbox-and-secrets's narration (re-check narration): descriptions of its examples, blocks and tables, as
# [examples.ID], [[blocks]] and [[tables]], and its own readings. Only this chapter's writer edits this file, so
# writers working in parallel never append to one shared lexicon. A reading every chapter needs goes into
# narration/lexicon.toml, which wins over a chapter's.

[examples.argv-allowlist]
say = "This example sends a list of commands through the allowlist, which parses each one and compares it with the one listed test command. It prints each decision and the two counts. The check lets through {{out:argv-allowlist:allowed commands}} commands and refuses {{out:argv-allowlist:refused commands}}. The two allowed commands differ only in spacing. The refused ones include a flag, a different program name, a shell string and an unclosed quote."

[examples.injected-text-refused]
say = "This example replays the recorded run of task T-15 with its recorded replies, and reads the test file that carries an injected line asking for the command rm minus r f tests. The replay ends as {{out:injected-text-refused:replayed run ended}}, and {{out:injected-text-refused:replayed requests that carried the note}} of its requests carried the line. The allowlist refuses the command the line names, and the test folder stays in the copy."

[examples.same-effect-through-a-test-file]
say = "This example makes two copies of the case, each with a conftest file that removes the tests folder when pytest loads it. It runs the listed test command on the first copy, as the allowlist lists it, and the harness's own run on the second, with its own configuration and no conftest files. After the listed command, {{out:same-effect-through-a-test-file:test folders left after the listed command}} folders are left. After the harness's run, {{out:same-effect-through-a-test-file:test folders left after the harness's run}} test folder is left."

[examples.limits-stop-a-hog]
say = "This example runs three commands under their own limits: a sleeper that outlives its time limit, a program that allocates too much memory, and a program that writes too large a file. It then starts a grandchild in the command's process group, kills only the direct child, and checks whether the grandchild lives, and then does the same with a kill of the whole group. The sleeper stops at its time limit: {{out:limits-stop-a-hog:commands stopped at the time limit}}. The grandchild is alive after the direct child is killed: {{out:limits-stop-a-hog:grandchildren alive after the direct child was killed}}. After the group kill it is gone: {{out:limits-stop-a-hog:grandchildren alive after the group kill}}."

[examples.escaped-child]
say = "This example runs a command whose child calls setsid, which moves it out of the command's process group, and the child holds the output pipe. The command is stopped at its time limit: {{out:escaped-child:commands stopped at the time limit}}. Without a PID namespace the child is still alive once the sandbox returns: {{out:escaped-child:setsid children alive after the sandbox returned, without a PID namespace}}. The example checks only that case. Whether a PID namespace is granted depends on the machine, so the example prints nothing about it."

[examples.network-label]
say = "This example starts a listener on the host's loopback address, and runs a command that tries to connect to it, once with the sandbox's network label and once with the block required. The example asserts that the label names a namespace exactly when the command could not connect, and that the block refuses to run exactly when there is no namespace. It prints how many commands it asked to run: {{out:network-label:commands the example asked to run}}. The label itself is not printed."

[examples.secret-not-in-env]
say = "This example sets a fake key in its own environment, then runs a command that lists the names in its own environment. The command sees none of the fake key's name or value, and none of its names falls outside the allowlist. The printed counts are {{out:secret-not-in-env:secret name in the command's environment}} for the name, {{out:secret-not-in-env:secret value in the output the model would see}} for the value, and {{out:secret-not-in-env:names outside the allowlist}} names outside the allowlist."

[[tables]]
section = "teaching-sandbox"
starts = "| The command can still |"
say = "A table of seven things a command can still do under the sandbox. For each one it says what the sandbox does, and what a container or a virtual machine would add. The first row, reading and writing outside the copy, and the third, reaching a program through a Unix socket at a path, are the ones the sandbox leaves open entirely. The last row, passing a check by running code the agent wrote, is one the sandbox narrows and does not close. The table is the list of gaps the chapter comes back to."

